name: Build Drift APK

on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The curfew and emergency rules are a plain JVM build, so they are checked
      # before anything Android specific is even configured.
      - name: Test the night rules
        working-directory: drift
        run: ./gradlew -p core test

      - name: Build debug APK
        working-directory: drift
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drift-debug-apk
          path: drift/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
