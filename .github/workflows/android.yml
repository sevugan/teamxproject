name: Build Drift APK

on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:

# Needed to attach the APK to a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The night rules are a plain JVM build, so they are checked before anything
      # Android specific is even configured.
      - name: Test the night rules
        working-directory: drift
        run: ./gradlew -p core test

      - name: Build debug APK
        working-directory: drift
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK after its version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp drift/app/build/outputs/apk/debug/app-debug.apk "drift-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-debug-apk
          path: drift-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      # A release per build, so Obtainium (or a plain browser) can install and update
      # straight from the phone without unzipping anything.
      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES="$(git log -1 --pretty=%s)

          Debug build of Drift, signed with the shared debug key in this repository.
          Install it directly, or point Obtainium at this repository to get updates.

          Built from ${GITHUB_SHA:0:7} on $GITHUB_REF_NAME."
          # Re-runs of the same build should replace the asset, not fail.
          gh release create "$TAG" "drift-$VERSION.apk" \
            --title "Drift $VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
          || gh release upload "$TAG" "drift-$VERSION.apk" --clobber
